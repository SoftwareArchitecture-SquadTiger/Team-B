services:
  donor-service:
    build:
      context: ./services/donor-service
      dockerfile: Dockerfile
    container_name: donor-service
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: ${KAFKA_EXTERNAL_ADVERTISED_HOSTNAME}:${KAFKA_EXTERNAL_PORT}
      MONGO_URI: ${MONGO_URI} 
    volumes:
      - ./services/donor-service:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "start"]
  
  charity-service:
    build:
      context: ./services/charity-service
      dockerfile: Dockerfile
    container_name: charity-service
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: ${KAFKA_EXTERNAL_ADVERTISED_HOSTNAME}:${KAFKA_EXTERNAL_PORT}
      MONGO_URI: ${MONGO_URI}
    volumes:
      - ./services/charity-service:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "start"]
    
  authentication-service:
    build:
      context: ./services/authentication-service
      dockerfile: Dockerfile
    container_name: authentication-service
    depends_on:
      - kafka
      - charity-service
      - donor-service
    environment:
      KAFKA_BROKER: ${KAFKA_EXTERNAL_ADVERTISED_HOSTNAME}:${KAFKA_EXTERNAL_PORT}
      MONGO_URI: ${MONGO_URI}
      JWS_PRIVATE_KEY_PATH: ${KEY_PATH}jws_private.pem
      JWE_PUBLIC_KEY_PATH: ${KEY_PATH}jwe_public.pem
      RSA_PRIVATE_KEY_PATH: ${KEY_PATH}rsa_private.pem
    volumes:
      - ./services/authentication-service:/usr/src/app
      - /usr/src/app/node_modules
      - ./keys:/usr/src/app/keys
    command: ["npm", "start"]

